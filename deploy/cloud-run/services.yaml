# Replace PROJECT_ID and REVISION. Internal services intentionally omit public invoker bindings.
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: bottleneck-iq-api-gateway}
spec: {template: {metadata: {annotations: {autoscaling.knative.dev/minScale: '0', autoscaling.knative.dev/maxScale: '5'}}, spec: {serviceAccountName: bottleneck-iq-api-gateway-sa@PROJECT_ID.iam.gserviceaccount.com, containerConcurrency: 40, timeoutSeconds: 60, containers: [{image: asia-south1-docker.pkg.dev/PROJECT_ID/bottleneck-iq/api:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}, {name: INTEGRATION_TOKEN, valueFrom: {secretKeyRef: {name: bottleneck-iq-integration-token, key: latest}}}, {name: ROLE_TOKEN_SECRET, valueFrom: {secretKeyRef: {name: bottleneck-iq-role-token-secret, key: latest}}}], resources: {limits: {cpu: '1', memory: 1Gi}}}]}}}
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata: {name: bottleneck-iq-orchestrator}
spec: {template: {spec: {serviceAccountName: bottleneck-iq-orchestrator-sa@PROJECT_ID.iam.gserviceaccount.com, containerConcurrency: 20, containers: [{image: asia-south1-docker.pkg.dev/PROJECT_ID/bottleneck-iq/orchestrator:REVISION, ports: [{containerPort: 8080}], env: [{name: PRODUCTION_EXECUTION, value: 'false'}]}]}}}
---
